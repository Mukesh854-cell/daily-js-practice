<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-gpt exercises</title>
</head>
<body>
    
    <script>
        // SUM OF NUMBERS
        const sum = [10, 20, 30, 40, 50];

        const addNum = sum.reduce((accumulator, current) => {
            return accumulator + current;
        }, 0);
        console.log(addNum);

        // FIND LARGEST NUMBER
        const nums = [12, 45, 7, 89, 23];

        const largestNum = nums.reduce((accumulator, current) => {
            if (current > accumulator) {
                return current;
            } else {
                return accumulator;
            }
        } ,0)
        console.log(largestNum);

        // REMOVE DUPLICATIONS
        const duplicateNums = [1, 2, 2, 3, 4, 4, 5];

        const normalNums = duplicateNums.filter((num, index) => {
            return duplicateNums.indexOf(num) === index;
        })
        console.log(normalNums)
    </script>
</body>
</html>
