<!DOCTYPE html>
<html lang="en">

<head>

    <title>Gallery Warmup</title>

<body>

    <script>

            },
            {
                id: 2,
                url: "https://www.shutterstock.com/image-photo/fabulous-colorful-scenery-mountains-during-260nw-1912343491.jpg"
            },
            {
                id: 3,
                url: "https://media.istockphoto.com/id/507476938/photo/summer-morning-scene-of-carpathian-mountains.jpg?s=170667a&w=0&k=20&c=diaU07_uiWN53tOmP3_iZnEQUKlk8_EC-NHr6xbIRS8="
            },
            {
                id: 4,
                url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcLh3NCsAafrzyyDl6mJBsa9gXjW0vnqBT2epPmx-SvG8WXzxEwVNQyYI&s=10"

            }
        ];
        const newAlbum = album.map((photo) => {
            return photo.url;
        })
        console.log(newAlbum);


        let page = 1;
        function nextPage() {
            return ++page;
        }
        console.log(nextPage());
        console.log(nextPage());
        console.log(nextPage());

        // DOM
        const gridDiv = document.querySelector('.grid');

        album.forEach((item) => {
            const image = document.createElement('img');
            image.src = item.url;
            gridDiv.appendChild(image);
        });
    </script>
</body>

</html>
