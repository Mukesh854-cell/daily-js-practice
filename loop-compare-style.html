<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop compare style</title>
</head>

<body>

    <div class="box" data-num="1">1</div>
    <div class="box" data-num="2">2</div>
    <div class="box" data-num="3">3</div>
    <div class="box" data-num="4">4</div>
    <div class="box" data-num="5">5</div>

    <script>
        // .forEach()
        const values = [45, 82, 30, 95, 60];

        values.forEach((value) => {
            if (value >= 50) {
                console.log("PASS")
            } else {
                console.log("FAIL");
            }
        });

        const boxNumbers = [1, 2, 3, 4, 5];
        const threshold = 3;

        boxNumbers.forEach((boxNumber) => {
            if (boxNumber <= threshold) {
                console.log('FILL');
            } else {
                console.log('EMPTY');
            }
        })

        const boxs = document.querySelectorAll('.box');

        boxs.forEach((box) => {
            if (Number(box.dataset.num) <= threshold) {
                box.style.backgroundColor = 'green'; 
            } else {
                box.style.backgroundColor = 'red';
            }
        });
    </script>
</body>

</html>
