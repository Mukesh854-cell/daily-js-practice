<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Drill</title>
</head>

<body>
    <form action="" class="js-form">
        <input type="text" class="js-name">
        <input type="text" class="js-note">
        <button type="button" class="js-clear">Clear</button>
    </form>

    <script>
        function loadDraft(text) {
            if (text === null) {
                return { name: '', note: '' }
            } else {
                return JSON.parse(text);
            }
        }

        console.log(loadDraft('{"name":"Asha", "note":"hi"}'));
        console.log(loadDraft(null));

        function saveDraft(draft) {
            if (draft === null) {
                return { name: '', note: '' }
            } else {
                return JSON.stringify(draft);
            }
        }

        console.log(saveDraft({ name: 'Asha', note: 'hi' }));
        console.log(saveDraft(null))

        // DOM
        const jsForm = document.querySelector('.js-form');
        const jsName = document.querySelector('.js-name');
        const jsNote = document.querySelector('.js-note');
        const jsClear = document.querySelector('.js-clear');

        jsForm.addEventListener('input', () => {
            const draft = {
                name: jsName.value,
                note: jsNote.value
            }
            localStorage.setItem('draft', JSON.stringify(draft));
        })

        const saveText = localStorage.getItem('draft');
        console.log(saveText);

        const draftID = loadDraft(saveText);
        console.log(draftID)

        jsName.value = draftID.name;
        jsNote.value = draftID.note;

        localStorage.setItem('temp', 'hello')
        console.log(localStorage.getItem('temp'))
        localStorage.removeItem('temp')
        console.log(localStorage.getItem('temp'))

        jsClear.addEventListener('click', () => {
            jsName.value = '';
            jsNote.value = '';
            localStorage.removeItem('draft');
        })

    </script>
</body>

</html>
