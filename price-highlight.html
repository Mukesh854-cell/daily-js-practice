<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Highlight</title>
</head>

<body>
    <div class="price" data-price="100">100</div>
    <div class="price" data-price="250">250</div>
    <div class="price" data-price="400">400</div>
    <div class="price" data-price="550">550</div>
    <div class="price" data-price="700">700</div>

    <script>
        const threshold = 300;
        const itemPrice = document.querySelectorAll('.price');

        itemPrice.forEach((prices) => {
            if (Number(prices.dataset.price) >= threshold) {
                prices.style.color = 'green';
            } else {
                prices.style.color = 'gray';
            }
        });
    </script>
</body>

</html>
