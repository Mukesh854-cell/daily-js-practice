<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Change</title>
    <style>
        .container {
            height: 100px;
            width: 300px;
            border-radius: 10px;
            background-color: black;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            align-items: center;

        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        .reset {
            background-color: rgb(207, 170, 121);
        }

        .color {
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 15px;
        }
    </style>

</head>

<body>
    <div class="container"></div>
    <button class="color red" data-color="1">Red</button>
    <button class="color green" data-color="2">Green</button>
    <button class="color blue" data-color="3">Blue</button>
    <button class="color reset" data-color="4">Reset</button>

    <script>
        const container = document.querySelector('.container');
        const allBtn = document.querySelectorAll('.color');

        const colors = {
            1: 'red',
            2: 'green',
            3: 'blue',
        }

        allBtn.forEach((btn) => {

            btn.addEventListener('click', () => {

                if (btn.dataset.color === '4') {
                    container.style.backgroundColor = 'rgb(207, 170, 121)';
                    container.textContent = 'DEFAULT COLOR';
                } else {
                    container.style.backgroundColor = colors[btn.dataset.color];
                    container.textContent = btn.textContent;
                }

                // if (btn.dataset.color === '1') {
                //     container.style.backgroundColor = 'red';
                //     container.textContent = 'RED COLOR';
                // } else if (btn.dataset.color === '2') {
                //     container.style.backgroundColor = 'green';
                //     container.textContent = 'GREEN COLOR';
                // } else if (btn.dataset.color === '3') {
                //     container.style.backgroundColor = 'blue';
                //     container.textContent = 'BLUE COLOR';
                // } else {
                //     container.style.backgroundColor = 'rgb(207, 170, 121)';
                //     container.textContent = 'DEFAULT COLOR';
                // }

            })
        })

    </script>
</body>

</html>
