<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save VS Calculate</title>
</head>
<body>
    

    <script>
        let dishes = [
            { name: 'Pizza', price: 200, quantity: 2 },
            { name: 'Burger', price: 100, quantity: 1 }
        ]

        localStorage.setItem('dishes', JSON.stringify(dishes));
        const save = JSON.parse(localStorage.getItem('dishes'));

        console.log(save);

        function getDrillTotal(items) {
            return items.reduce((accumulator, current) => {
                return accumulator + (current.price * current.quantity);
            }, 0)
        }

        console.log(getDrillTotal(save));
    </script>
</body>
</html>
