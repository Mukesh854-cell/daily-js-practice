<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intersection Observer</title>
    <style>
        p {
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="list"></div>
    <div class="marker">The end</div>
    <script>
        const items = [
            { id: 1, isVisible: false },
            { id: 2, isVisible: true },
            { id: 3, isVisible: false }
        ]

        items.forEach((item) => {
            if (item.isVisible) {
                console.log(`item ${item.id} is visible`);
            } else {
                console.log(`item ${item.id} is hidden`);
            }
        })

        // DOM
        const listDiv = document.querySelector('.list');
        const markerDiv = document.querySelector('.marker');

        let page = 1;
        let totalPages = 3;
        let count = 1;

        function addItems() {
            if (page > totalPages) {
                return;
            }
            page++;

            for (let i = 1; i <= 10; i++) {
                listDiv.innerHTML += `<p>Item ${count++}</p>`;
            }
        }
        addItems();


        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    addItems();
                }
            })
        })
        observer.observe(markerDiv);
    </script>
</body>

</html>
