<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength</title>
</head>

<body>
    <input type="password" class="password">
    <p class="strength"></p>
    
    <script>
        const inputPass = document.querySelector('.password');
        const strength = document.querySelector('.strength');


        inputPass.addEventListener('input', () => {
            const inputPassValue = inputPass.value;

            if (inputPass.value === '') {
                strength.textContent = '';
                return;
            }

            if (inputPassValue.length < 6) {
                strength.textContent = `password strength is Weak`;
            } else if (inputPassValue.length <= 9 && inputPassValue.length >= 6) {
                strength.textContent = `password strength is Medium`;
            } else {
                strength.textContent = `password strength is Strong`;
            }
        })
    </script>
</body>

</html>
