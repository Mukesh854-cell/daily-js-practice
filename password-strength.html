<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength</title>
    <style>
        p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>

<body>
    <input type="password" class="password">
    <button class="show">Show</button>
    <p class="strength"></p>

    <script>
        const inputPass = document.querySelector('.password');
        const show = document.querySelector('.show');
        const strength = document.querySelector('.strength');

        show.addEventListener('click', () => {

            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                show.textContent = 'Hide';
            } else {
                inputPass.type = 'password';
                show.textContent = 'Show';
            }
        });

        inputPass.addEventListener('input', () => {
            const inputPassValue = inputPass.value;

            if (inputPass.value === '') {
                strength.textContent = '';
                return;
            }

            if (inputPassValue.length < 6) {
                strength.innerHTML = `password strength: <span style="color: red; font-weight: bold">Weak</span>`;
            } else if (inputPassValue.length <= 9) {
                strength.innerHTML = `password strength: <span style="color: orange; font-weight: bold">Medium</span>`;
            } else {
                strength.innerHTML = `password strength: <span style="color: green; font-weight: bold">Strong</span>`;
            }
        })
    </script>
</body>

</html>
